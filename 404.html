<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — SnappRice</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="src/css/style.css?v12">
  <link rel="icon" href="src/logo.png?v4">
  <style>
    .error-page { text-align: center; padding: 80px 20px; max-width: 500px; margin: 0 auto; }
    .error-page h1 { font-size: 72px; font-weight: 900; color: var(--primary); margin-bottom: 4px; }
    .error-page h2 { font-size: 22px; color: var(--dark); margin-bottom: 10px; }
    .error-page p { color: var(--gray-500); margin-bottom: 24px; }
    .error-page .search-box { max-width: 400px; margin: 0 auto 24px; }
    .error-page .home-link { display: inline-block; padding: 10px 24px; background: var(--primary); color: white; border-radius: 8px; text-decoration: none; font-weight: 600; }
    .error-page .home-link:hover { background: var(--primary-dark); }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="/" class="logo">
        <img src="src/logo.png?v2" alt="SnappRice" style="width:56px;height:56px;border-radius:12px">
        <span style="font-size:34px;font-weight:800;color:var(--dark);margin-left:8px">Snap</span>
        <span style="font-size:34px;font-weight:800;color:#16a34a">Price</span>
      </a>
    </div>
  </header>
  <main>
    <div class="error-page">
      <h1>404</h1>
      <h2>Page not found</h2>
      <p>The page you're looking for doesn't exist or has been moved.</p>
      <div class="search-box">
        <input type="text" id="search404" placeholder="Search products..." style="width:100%;padding:12px 16px;border:2px solid var(--gray-200);border-radius:8px;font-size:16px;outline:none" onkeydown="if(event.key==='Enter'&&this.value.trim())window.location.href='/?q='+encodeURIComponent(this.value.trim())">
      </div>
      <a href="/" class="home-link">← Back to Home</a>
    </div>
  </main>
</body>
</html>
