  <style>
    .blog-page { max-width: 800px; margin: 40px auto; padding: 0 0 80px; }
    .blog-page h1 { font-size: 28px; margin-bottom: 8px; }
    .blog-page .subtitle { font-size: 15px; color: var(--gray-500); margin-bottom: 32px; }
    .blog-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .blog-card { display: block; padding: 20px 24px; background: var(--white); border: 1px solid var(--gray-200); border-radius: 12px; text-decoration: none; transition: box-shadow .2s, border-color .2s; }
    .blog-card:hover { border-color: var(--primary); box-shadow: 0 2px 12px rgba(22,163,74,0.1); }
    .blog-card h2 { font-size: 16px; color: var(--dark); margin-bottom: 4px; line-height: 1.4; }
    .blog-card .meta { font-size: 12px; color: var(--gray-400); margin-bottom: 8px; }
    .blog-card p { font-size: 13px; color: var(--gray-600); line-height: 1.5; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .pagination-bar { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 32px; }
    .page-info { font-size: 14px; color: var(--gray-500); }
    .page-btn { padding: 8px 20px; background: var(--primary); color: #fff; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 600; transition: background .2s; }
    .page-btn:hover { background: #15803d; }
    .page-btn.disabled { opacity: 0.4; pointer-events: none; }
    @media (max-width: 600px) { .blog-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  </script>

    articles.sort(function(a,b){return new Date(b.date)-new Date(a.date);});
    var perPage = 10, page = 1, totalPages = Math.ceil(articles.length/perPage);
    function renderPage(p) {
      var start = (p-1)*perPage, end = Math.min(start+perPage, articles.length);
      var items = articles.slice(start, end);
      var grid = document.getElementById('blogGrid');
      grid.innerHTML = items.map(function(a){return '<a class="blog-card" href="/blog/'+a.file+'"><h2>'+a.title+'</h2><div class="meta">'+a.date+' · '+a.tag+'</div><p>'+a.desc+'</p></a>';}).join('');
      var bar = document.getElementById('paginationBar');
      if (totalPages <= 1) { bar.innerHTML = ''; return; }
      bar.innerHTML = (p>1?'<a class="page-btn" href="#" onclick="renderPage('+(p-1)+');return false;">← Prev</a>':'<span class="page-btn disabled">← Prev</span>') +
        '<span class="page-info">Page '+p+' of '+totalPages+'</span>' +
        (p<totalPages?'<a class="page-btn" href="#" onclick="renderPage('+(p+1)+');return false;">Next →</a>':'<span class="page-btn disabled">Next →</span>');
      window.scrollTo({top:0,behavior:'smooth'});
    }
    renderPage(1);
