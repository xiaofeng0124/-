  <meta name="description" content="Manage your SnappRice account, favorites, price alerts and more.">

  <style>
    .account-layout { display: flex; min-height: 100vh; }
    .account-sidebar { width: 220px; flex-shrink: 0; background: var(--white); border-right: 1px solid var(--gray-200); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
    .sidebar-brand { padding: 24px 20px 20px; border-bottom: 1px solid var(--gray-100); }
    .sidebar-brand a { text-decoration: none; font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .sidebar-brand .brand-snap { color: var(--dark); }
    .sidebar-brand .brand-price { color: #16a34a; }
    .sidebar-nav { flex: 1; padding: 8px 0; overflow-y: auto; }
    .sidebar-nav button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 20px; border: none; background: none; font-size: 14px; font-weight: 600; color: var(--gray-700); cursor: pointer; transition: all 0.15s; text-align: left; border-left: 3px solid transparent; }
    .sidebar-nav button:hover { background: var(--gray-50); color: var(--dark); }
    .sidebar-nav button.active { background: var(--gray-100); color: var(--dark); font-weight: 700; border-left-color: var(--gray-300); }
    .sidebar-footer { padding: 20px 24px; border-top: 1px solid var(--gray-100); }
    .sidebar-footer { padding: 16px 20px; border-top: 1px solid var(--gray-100); }
    .sidebar-email { display: block; font-size: 13px; font-weight: 500; color: var(--gray-600); margin-bottom: 10px; word-break: break-all; }
    .sidebar-logout { width: 100%; padding: 10px; border: 1px solid var(--gray-200); border-radius: 8px; background: none; color: #dc2626; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .sidebar-logout:hover { background: #fef2f2; border-color: #fca5a5; }
    .account-content { flex: 1; padding: 32px 40px; overflow-y: auto; font-size: 16px; max-width: 900px; }
    #floatSearchBar { display: none !important; }
    @media (max-width: 768px) {
      .account-layout { flex-direction: column; min-height: auto; }
      .account-content { max-width: none; }
      .account-sidebar { width: 100%; position: static; height: auto; border-right: none; border-bottom: 1px solid var(--gray-200); }
      .sidebar-nav { display: flex; flex-wrap: wrap; padding: 8px 12px; gap: 4px; }
      .sidebar-nav button { width: auto; padding: 6px 12px; font-size: 13px; border-radius: 6px; border-left: none; font-weight: 500; }
      .sidebar-nav button.active { border-left: none; background: var(--gray-100); }
      .sidebar-footer { padding: 12px 16px; }
      .account-content { padding: 16px; }
    }
  </style>
</head>
<body>

<main>
  <div class="account-layout">
    <aside class="account-sidebar" id="accountSidebar">
      <div class="sidebar-brand">
        <a href="/"><img src="src/logo.png?v2" alt="SnappRice" style="width:28px;height:28px;border-radius:6px"><span class="brand-snap">Snap</span><span class="brand-price">Price</span></a>
      </div>
      <nav class="sidebar-nav" id="sidebarNav">
        <button class="active" data-tab="favorites"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg> Favorites</button>
        <button data-tab="history"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> History</button>
        <button data-tab="alerts"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg> Price Alerts</button>
        <button data-tab="predictions"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg> Price Predictions</button>
        <button data-tab="export"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Export Data</button>
        <button data-tab="coupons"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4"/><path d="M12 4l-8 8 8 8"/></svg> Coupons</button>
        <button data-tab="settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg> Account Settings</button>
      </nav>
      <div class="sidebar-footer">
        <span class="sidebar-email" id="sidebarEmail"></span>
        <button class="sidebar-logout" id="sidebarLogoutBtn">Sign Out</button>
      </div>
    </aside>
    <div class="account-content" id="accountContent"></div>
  </div>
</main>

<div class="modal-overlay" id="authModal">
  <div class="modal" style="max-width:380px">
    <button class="modal-close" id="authModalClose">&times;</button>
    <div id="authFormContainer"></div>
  </div>
</div>
