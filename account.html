<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account — SnappRice</title>
  <meta name="description" content="Manage your SnappRice account, favorites, price alerts and more.">

  <style>
    .account-layout { display: flex; min-height: calc(100vh - 70px); max-width: 1200px; margin: 0 auto; }
    .account-sidebar { width: 240px; flex-shrink: 0; background: var(--white); border-right: 1px solid var(--gray-200); display: flex; flex-direction: column; padding: 0; position: sticky; top: 70px; height: calc(100vh - 70px); }
    .sidebar-brand { padding: 24px 24px 20px; border-bottom: 1px solid var(--gray-100); }
    .sidebar-brand a { text-decoration: none; font-size: 22px; font-weight: 800; }
    .sidebar-brand .brand-snap { color: var(--dark); }
    .sidebar-brand .brand-price { color: #16a34a; }
    .sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; }
    .sidebar-nav button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 24px; border: none; background: none; font-size: 14px; color: var(--gray-700); cursor: pointer; transition: all 0.15s; text-align: left; }
    .sidebar-nav button:hover { background: var(--gray-50); color: var(--dark); }
    .sidebar-nav button.active { background: var(--primary-light); color: var(--primary); font-weight: 600; border-right: 3px solid var(--primary); }
    .sidebar-footer { padding: 16px 24px; border-top: 1px solid var(--gray-100); }
    .sidebar-email { display: block; font-size: 13px; color: var(--gray-500); margin-bottom: 10px; word-break: break-all; }
    .sidebar-logout { width: 100%; padding: 8px; border: 1px solid var(--gray-200); border-radius: 6px; background: none; color: var(--red); font-size: 13px; cursor: pointer; transition: all 0.15s; }
    .sidebar-logout:hover { background: #fef2f2; border-color: var(--red); }
    .account-content { flex: 1; padding: 28px 32px; overflow-y: auto; min-height: calc(100vh - 70px); }
    @media (max-width: 768px) {
      .account-layout { flex-direction: column; }
      .account-sidebar { width: 100%; position: static; height: auto; border-right: none; border-bottom: 1px solid var(--gray-200); }
      .sidebar-nav { display: flex; flex-wrap: wrap; padding: 8px 12px; gap: 4px; }
      .sidebar-nav button { width: auto; padding: 6px 12px; font-size: 13px; border-radius: 6px; }
      .sidebar-nav button.active { border-right: none; background: var(--primary-light); }
      .sidebar-footer { padding: 12px 16px; }
      .account-content { padding: 16px; }
    }
  </style>
</head>
<body>

<main>
  <div class="account-layout">
    <!-- Left Sidebar -->
    <aside class="account-sidebar" id="accountSidebar">
      <div class="sidebar-brand">
        <a href="/"><span class="brand-snap">Snap</span><span class="brand-price">Price</span></a>
      </div>

      <nav class="sidebar-nav" id="sidebarNav">
        <button class="active" data-tab="favorites">❤️ Favorites</button>
        <button data-tab="history">🕐 History</button>
        <button data-tab="alerts">🔔 Price Alerts</button>
        <button data-tab="coupons">🎫 Coupons</button>
        <button data-tab="settings">⚙️ Account Settings</button>
      </nav>

      <div class="sidebar-footer">
        <span class="sidebar-email" id="sidebarEmail"></span>
        <button class="sidebar-logout" id="sidebarLogoutBtn">Sign Out</button>
      </div>
    </aside>

    <!-- Right Content -->
    <div class="account-content" id="accountContent">
      <!-- Rendered by JS -->
    </div>
  </div>
</main>

<!-- Auth Modal -->
<div class="modal-overlay" id="authModal">
  <div class="modal" style="max-width:380px">
    <button class="modal-close" id="authModalClose">&times;</button>
    <div id="authFormContainer"></div>
  </div>
</div>
